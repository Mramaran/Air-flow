[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airflow-provider-serpapi"
version = "0.1.0"
description = "Community Apache Airflow provider for SerpApi: batch searches that release the worker, a quota guard and a SerpApi connection type."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["airflow", "serpapi", "provider", "search"]
classifiers = [
    "Framework :: Apache Airflow",
    "Framework :: Apache Airflow :: Provider",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
airflow = ["apache-airflow>=3.0"]
dev = ["pytest>=8"]

[project.entry-points.apache_airflow_provider]
provider_info = "serpapi_provider:get_provider_info"

[tool.setuptools.packages.find]
include = ["serpapi_provider*", "replay*"]

[tool.setuptools.package-data]
replay = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
